spring.application.name=HostelHub

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/hostelhub_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.security.user.name=user
spring.security.user.password={noop}HostelHubDev@123

# JWT Configuration
app.jwt.secret=HostelHub-Development-JWT-Secret-Key-2026-Do-Not-Use-In-Production
app.jwt.expiration=86400000

logging.level.org.springframework.security=TRACE

springdoc.swagger-ui.display-openapi-version=false
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.urls-primary-name=HostelHub API